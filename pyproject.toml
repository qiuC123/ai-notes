[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-notes"
version = "0.2.0"
description = "Auditable high-quality AI release acquisition with staged Hermes review"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29",
  "jsonschema>=4,<5",
  "PyYAML>=6,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_notes = ["schemas/*.json"]
